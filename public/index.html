<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-separator" content="transparent">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="احكي عن قرارك، وبشوف معك الفرق بوضوح. بدون ما أحد يقرر عنك.">
  <title>قراراتي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════ بوابة الرمز ═══════ -->
<div id="gate" class="gate hidden">
  <div class="gate-box">
    <div class="gate-logo">⚖️</div>
    <h1>قراراتي</h1>
    <p class="gate-sub">احكي عن قرارك، وبشوف معك الفرق.<br>بس ما بقرر عنك.</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4"
           placeholder="أدخل الرمز" autocomplete="off">
    <button id="pinBtn" class="btn-primary">فتح</button>
    <p id="gateErr" class="gate-err"></p>
  </div>
</div>

<!-- ═══════ الشات ═══════ -->
<div id="chat" class="chat hidden">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚖️</span>
      <span>قراراتي</span>
    </div>
    <button id="btnNew" class="btn-ghost btn-sm" title="محادثة جديدة">＋ جديد</button>
  </header>

  <main id="stream" class="stream" aria-live="polite"></main>

  <!-- أمثلة جاهزة بتظهر أول مرة بس -->
  <div id="starters" class="starters hidden">
    <p class="starters-label">جرّبي تكتب:</p>
    <div class="starters-row">
      <button class="starter" data-s="محتار بين وظيفتين: الأولى قريبة وراتبها متوسط ودوامها مريح، والثانية راتبها ممتاز بس بعيدة وشفتاتها طويلة.">بين وظيفتين</button>
      <button class="starter" data-s="لرح سافر على مدينة ثانية بس حاسس حالي مرتاح بمدينتي">بين مدينتين</button>
      <button class="starter" data-s="بفكر أشتري سيارة ولا أضل أواصل قولب باص.">مركبة ولا مواصلات</button>
    </div>
  </div>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="احكي عن قرارك…" autocomplete="off"></textarea>
      <button id="send" class="send" aria-label="إرسال">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>
    <p class="composer-note">ما بقدر أقترح عليك خيار — بشوف الفرق بس.</p>
  </footer>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // ?v=<رقم> كسر التخزين المؤقت: بدونه المتصفح بيحتفظ بنسخة
    // sw.js القديمة وما بشوف تغييراتنا أبداً.
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v=3').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (sw) sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
